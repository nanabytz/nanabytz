name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#B026FF&color_dots=#ebedf0,#ffc5b3,#ff9b7a,#ff7847,#ff5f1f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#B026FF&color_dots=#2d3343,#783525,#ab4526,#e15521,#ff5f1f
            
      - name: Inject Violet Neon Border
        run: |
          sed -i 's/<\/svg>/<rect width="100%" height="100%" fill="none" stroke="#B026FF" stroke-width="8" rx="10" \/><\/svg>/' dist/github-snake.svg
          sed -i 's/<\/svg>/<rect width="100%" height="100%" fill="none" stroke="#B026FF" stroke-width="8" rx="10" \/><\/svg>/' dist/github-snake-dark.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
